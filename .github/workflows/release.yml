name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: gcc
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        if: matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: make CC=${{ matrix.cc }}
      - run: mv fasterfetch fasterfetch-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fasterfetch-linux-${{ matrix.arch }}
          path: fasterfetch-linux-${{ matrix.arch }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: mv fasterfetch fasterfetch-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: fasterfetch-macos-universal
          path: fasterfetch-macos-universal

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
